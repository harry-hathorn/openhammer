<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06090F"/>
      <stop offset="1" stop-color="#0D131D"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A8DCFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#4FA8E8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4FA8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7E8FF"/>
      <stop offset="1" stop-color="#4FA8E8"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="205" cy="315" rx="290" ry="310" fill="url(#halo)"/>
  <rect x="0" y="0" width="1200" height="2" fill="#2C5F8A"/>

  <!-- hammer mark -->
  <g transform="translate(118,168)" filter="url(#g)">
    <rect x="0" y="0" width="150" height="48" rx="9" fill="url(#hd)"/>
    <rect x="60" y="48" width="30" height="172" rx="9" fill="#EAF2FA"/>
  </g>

  <text x="360" y="196" font-family="monospace" font-size="22" letter-spacing="5" fill="#A8DCFF">MCP · FILESYSTEM + SHELL</text>
  <rect x="360" y="210" width="48" height="2" fill="#4FA8E8"/>

  <text x="354" y="300" font-family="sans-serif" font-size="92" font-weight="800" fill="#EAF2FA" filter="url(#gt)">Open<tspan fill="#A8DCFF">Hammer</tspan></text>

  <text x="360" y="368" font-family="sans-serif" font-size="34" font-weight="600" fill="#EAF2FA">Turn your computer into an MCP-controlled surface.</text>
  <text x="360" y="410" font-family="sans-serif" font-size="23" fill="#8DA0B6">One HTTP endpoint. Bring Claude Desktop, Claude Code, Cursor, or your own client.</text>

  <text x="360" y="524" font-family="monospace" font-size="22" fill="#A8DCFF">openhammer.dev</text>
  <text x="1100" y="524" font-family="monospace" font-size="22" fill="#7FB4C9" text-anchor="end">github.com/harry-hathorn/openhammer</text>
</svg>
